[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-resilience-engine"
version = "0.1.0"
description = "Production-oriented intelligent financial resilience platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.29.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "google-genai>=3.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
data = ["pyarrow>=18.0.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.112.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
namespaces = true

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app/engines"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
